name: Record BLE Dashboard Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-ble-dashboard-demo
  cancel-in-progress: false

jobs:
  record-demo:
    name: Record MP4 and subtitles
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and subtitle font
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Validate recorder syntax
        run: python -m py_compile record_demo.py

      - name: Record dashboard replay
        run: |
          python record_demo.py \
            --html dashboard_recording_replay_start_on_click_balanced_speed.html \
            --output-dir output

      - name: Upload MP4, subtitles, CSV, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Classroom-Presence-Demo
          path: |
            output/BLE_Classroom_Presence_Demo.mp4
            output/BLE_Classroom_Presence_Demo.srt
            output/attendance_simulated_replay.csv
            output/debug_failure.png
          if-no-files-found: warn
          retention-days: 14
