name: Generate Dashboard Recording

on:
  workflow_dispatch:

jobs:
  record-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Playwright Script
        run: node record.js

      - name: Convert WebM to MP4 and Burn Subtitles (Demo)
        run: |
          ffmpeg -i raw_recording.webm -vf "subtitles=subtitles.srt" -c:v libx264 -preset fast -y demo.mp4

      - name: Stitch Videos Together
        # Creates a text file listing the videos in order, then concatenates them
        run: |
          echo "file '1.mp4'" > list.txt
          echo "file '2.mp4'" >> list.txt
          echo "file 'demo.mp4'" >> list.txt
          # Re-encode slightly to ensure all files share the exact same framerate, resolution, and format
          ffmpeg -f concat -safe 0 -i list.txt -c:v libx264 -preset fast -c:a aac -strict experimental -y Final_Submission.mp4

      - name: Upload Final Submission Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final_Submission_Video
          path: Final_Submission.mp4